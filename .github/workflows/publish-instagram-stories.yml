name: Publish Instagram Stories

on:
  push:
    paths:
      - 'stories/**/*.jpg'
      - 'stories/**/*.png'
  workflow_dispatch:
    inputs:
      stories_folder:
        description: 'Folder with stories to publish (e.g. stories/lynkro/tiempo-robado)'
        required: true
        default: 'stories/lynkro/tiempo-robado'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ID: ${{ secrets.IG_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          FOLDER: ${{ github.event.inputs.stories_folder }}
        run: |
          node << 'EOF'
          const { IG_ID, IG_ACCESS_TOKEN: TOKEN, REPO, BRANCH, EVENT, FOLDER } = process.env;
          const { execSync } = require('child_process');

          const files = EVENT === 'workflow_dispatch'
            ? execSync(`find "${FOLDER}" -name "*.jpg" -o -name "*.png" 2>/dev/null | sort`).toString().trim().split('\n').filter(Boolean)
            : execSync(`git diff --name-only HEAD~1 HEAD -- 'stories/**'`).toString().trim().split('\n').filter(f => /\.(jpg|png)$/.test(f));

          if (!files.length) { console.log('No stories found.'); process.exit(0); }

          const api = (path, params) => fetch(`https://graph.facebook.com/v21.0/${path}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ ...params, access_token: TOKEN })
          }).then(r => r.json());

          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            for (const [i, file] of files.entries()) {
              const image_url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${file}`;
              console.log(`Story ${i+1}/${files.length}: ${file}`);
              const { id } = await api(`${IG_ID}/media`, { image_url, media_type: 'STORIES' });
              if (!id) { console.error('No container ID'); continue; }
              await sleep(4000);
              const pub = await api(`${IG_ID}/media_publish`, { creation_id: id });
              console.log('Published:', pub.id);
              if (i < files.length - 1) await sleep(15000);
            }
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
